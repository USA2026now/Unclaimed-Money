<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unclaimed Money - Claim Your Funds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 26px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }
        .cta-btn {
            display: inline-block;
            background: #27ae60;
            color: #ffffff;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .cta-btn:hover {
            background: #219653;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Check Your Unclaimed Funds</h1>
        <p>You might have money waiting for you from government grants, insurance policies, or tax refunds. Click the button below to check now!</p>
       
        <!-- Offer Button -->
        <button id="offerBtn" class="cta-btn">Claim Now</button>
       
        <div class="footer-note">Secure & Verified System</div>
    </div>

    <script>
        document.getElementById('offerBtn').addEventListener('click', function (e) {
            e.preventDefault(); // Default jump rokay ga taake script execute ho sakay

            // Base Tracking Link
            let baseUrl = "https://digitaltoday.click/tracking/track.php?id=5e34df94507577b5df788eb073ea698d&o=909&u=51233&utm_source=instagram&utm_medium=social&utm_campaign=landing_page_offer";

            try {
                let url = new URL(baseUrl);
               
                // 100% Unique ID Generator (Random string + High precision timestamp + Performance counter)
                let randomPart1 = Math.random().toString(36).substring(2, 10);
                let randomPart2 = Math.random().toString(36).substring(2, 10);
                let preciseTime = Date.now().toString(36);
                let highPerf = Math.floor(performance.now() * 1000).toString(36);
               
                // Final unique string jo kabhi repeat nahi ho gi
                let uniqueClickId = `ig_${randomPart1}_${preciseTime}_${highPerf}_${randomPart2}`;

                // URL mein utm_content set kar dein
                url.searchParams.set('utm_content', uniqueClickId);

                // User ko naye dynamic link par redirect kar do
                window.location.href = url.toString();

            } catch (error) {
                console.error('Tracking Error:', error);
                // Fallback agar koi masla ho toh direct link khol de
                window.location.href = baseUrl;
            }
        });
    </script>

</body>
</html>
